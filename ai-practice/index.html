<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI 급식 도우미 연습문제</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 시험지 한 장처럼 사례(지문) 카드 옆에 문항을 두고, 좁은 화면에서는 위아래로 쌓는다 */
:root {
  --bg: #f3f6f5;
  --paper: #ffffff;
  --ink: #17211e;
  --muted: #5a6a64;
  --line: #d5dfdb;
  --rule: #e6ecea;
  --accent: #1d6b57;
  --accent-ink: #ffffff;
  --accent-soft: #e2f0eb;
  --ok: #1d7a3c;
  --ok-soft: #e3f3e7;
  --bad: #b3261e;
  --bad-soft: #fbe8e6;
  --part: #8a5a00;
  --part-soft: #fbf1dc;
  --chip: #edf2f0;
  --chip-line: #c8d4cf;
  --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-text: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --paper: #151d1a; --ink: #e5ede9; --muted: #9babA4; --line: #2b3732; --rule: #222c28;
    --accent: #5ec3a2; --accent-ink: #0b1411; --accent-soft: #17302a;
    --ok: #74d394; --ok-soft: #142d1d; --bad: #ff8f85; --bad-soft: #3a1815; --part: #f0c060; --part-soft: #33280f;
    --chip: #1e2925; --chip-line: #33433d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --paper: #151d1a; --ink: #e5ede9; --muted: #9babA4; --line: #2b3732; --rule: #222c28;
  --accent: #5ec3a2; --accent-ink: #0b1411; --accent-soft: #17302a;
  --ok: #74d394; --ok-soft: #142d1d; --bad: #ff8f85; --bad-soft: #3a1815; --part: #f0c060; --part-soft: #33280f;
  --chip: #1e2925; --chip-line: #33433d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header.top { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
h1 { font-size: clamp(22px, 4vw, 30px); margin: 0; line-height: 1.25; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 62ch; }
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; align-self: flex-start; }
.tab { font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 9px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab:focus-visible, button:focus-visible, textarea:focus-visible, .blank:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.group { display: grid; gap: 16px; align-items: start; }
@media (min-width: 980px) { .group { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); } .group .case { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.group > * { min-width: 0; }
.case { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.case-label { font-size: 13px; font-weight: 700; color: var(--accent); margin: 0 0 8px; }
.case p, .case li { font-family: var(--font-text); font-size: 16px; line-height: 1.85; margin: 0; text-align: justify; word-break: keep-all; }
.case p + p { margin-top: 8px; text-indent: 0; }
.case ul { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 8px; }
.case li { padding-left: 1.4em; text-indent: -1.4em; }
details.case summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: 13px; }
details.case[open] summary { margin-bottom: 8px; }

.qs { display: flex; flex-direction: column; gap: 16px; }
.q { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.q-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.q-num { font-weight: 700; font-size: 17px; }
.pts { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.prompt { margin: 0; word-break: keep-all; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; }
textarea {
  width: 100%; font: inherit; font-size: 15px; color: var(--ink); background-color: var(--paper);
  border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; resize: vertical;
  line-height: 2em; min-height: calc(4em + 2px);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2em - 1px), var(--rule) calc(2em - 1px), var(--rule) 2em);
  background-attachment: local;
}
textarea.tall { min-height: calc(8em + 2px); }
.picks { display: flex; gap: 8px; flex-wrap: wrap; }
.pick { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--chip-line); background: var(--chip); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; }
.pick input { accent-color: var(--accent); width: 16px; height: 16px; }
button.pick { font: inherit; font-weight: 700; color: var(--ink); }
button.pick.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sub-block { border-left: 3px solid var(--accent-soft); padding-left: 12px; display: flex; flex-direction: column; gap: 10px; }
.sub-title { font-weight: 700; margin: 0; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.result { border-radius: 12px; padding: 14px 16px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 10px; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score b { font-size: 22px; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); font-size: 13px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; font-size: 14px; word-break: keep-all; }
.mark { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 2px; }
.mark.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
.mark.no { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.model { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; font-family: var(--font-text); font-size: 15px; line-height: 1.8; }
.model p { margin: 0; }
.model p + p { margin-top: 6px; }

/* 스마트폰 탭 */
.fill-text { font-family: var(--font-text); font-size: 16px; line-height: 2.3; margin: 0; word-break: keep-all; }
.blank {
  display: inline-block; min-width: 4.6em; min-height: 1.7em; line-height: 1.6em; padding: 0 8px; margin: 0 2px;
  border: 1.5px dashed var(--chip-line); border-radius: 8px; text-align: center; vertical-align: middle;
  font-family: var(--font-ui); font-size: 14px; font-weight: 700; cursor: pointer; background: var(--paper); color: var(--ink);
}
.blank.filled { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.blank.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.blank.over { background: var(--accent-soft); border-color: var(--accent); }
.blank.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.blank.no { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.bank, .pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--rule); min-height: 52px; }
.bank-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 -4px; }
.chip {
  font: inherit; font-size: 14px; font-weight: 500; border: 1px solid var(--chip-line); background: var(--paper); color: var(--ink);
  padding: 6px 12px; border-radius: 9px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; text-align: left; word-break: keep-all;
}
.chip.dragging { opacity: .35; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.18); transform: translate(-50%, -60%); opacity: .95; }
.answer-zone { display: flex; flex-direction: column; gap: 8px; }
.slot { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: center; }
.slot-num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--chip); color: var(--muted); font-variant-numeric: tabular-nums; }
.slot-box { min-height: 40px; border: 1.5px dashed var(--chip-line); border-radius: 10px; background: var(--paper); display: flex; align-items: stretch; cursor: pointer; }
.slot-box:empty::before { content: "여기에 넣기"; color: var(--muted); font-size: 13px; align-self: center; padding: 0 12px; }
.slot-box.over { border-color: var(--accent); background: var(--accent-soft); }
.slot-box.next { border-color: var(--accent); }
.slot-box .chip { width: 100%; border: 0; background: transparent; }
.slot-box.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.slot-box.no { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
.toggle { font: inherit; font-weight: 700; font-size: 18px; width: 56px; height: 48px; border-radius: 12px; border: 1.5px solid var(--chip-line); background: var(--paper); color: var(--ink); cursor: pointer; }
.toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.toggle.ok { box-shadow: 0 0 0 3px var(--ok); }
.toggle.no { box-shadow: 0 0 0 3px var(--bad); }
.msg { margin: 0; font-weight: 700; font-size: 14px; }
.msg.ok { color: var(--ok); }
.msg.no { color: var(--bad); }
.msg.part { color: var(--part); }
.step2[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">세종중학교 정보 · 4단원 인공지능 논술형 연습</div>
    <h1>AI 급식 도우미 연습문제</h1>
    <p class="sub">사례를 읽고 네 문항을 풀어 보세요. 컴퓨터는 직접 써 보고, 스마트폰은 빈칸과 문장 조각으로 예시 답안을 완성해 보세요.</p>
    <div class="tabs" role="tablist" aria-label="풀이 방식">
      <button class="tab" role="tab" id="tab-pc" aria-controls="panel-pc" aria-selected="true">컴퓨터로 쓰기</button>
      <button class="tab" role="tab" id="tab-m" aria-controls="panel-m" aria-selected="false">스마트폰으로 풀기</button>
    </div>
  </header>

  <section id="panel-pc" role="tabpanel" aria-labelledby="tab-pc"></section>
  <section id="panel-m" role="tabpanel" aria-labelledby="tab-m" hidden></section>
</div>

<script>
(function () {
  // ---------- 지문 ----------
  const CASE1 = [
    "세종중학교 정보 동아리 학생들은 급식실 잔반을 줄이기 위해 'AI 급식 도우미'를 만들기로 했다. 퇴식구 위에 카메라를 달아 학생들이 반납하는 식판을 촬영하면, 인공지능이 그 사진을 분석하는 방식이다.",
    "시범 운영이 시작되자 AI 급식 도우미는 퇴식구 카메라에 찍힌 식판 사진을 보고 밥, 국, 반찬의 종류와 남은 양을 알아냈다. 또 지난 한 달 동안의 메뉴별 잔반 기록을 바탕으로 \"내일 메뉴인 카레는 잔반이 적고, 나물 반찬은 잔반이 많을 것\"이라고 미리 알려 주었고, 영양 기준을 지키면서도 버려지는 음식이 가장 적어지도록 반찬별 배식량을 조정한 다음 주 배식 계획안을 만들어 영양사 선생님께 제안했다. 점심시간에 학생들이 한꺼번에 몰리면 사람이 따로 조작하지 않아도 스스로 촬영 간격을 줄였고, 잔반이 많은 식판이 연달아 나오면 스스로 판단해 영양사 선생님께 알림을 보냈다.",
    "그런데 배추김치와 깍두기처럼 비슷하게 생긴 반찬은 자주 헷갈렸다. 그래서 동아리원 민수가 '배추김치 vs 깍두기' 분류 모델을 따로 만들기로 했다. 시간이 부족했던 민수는 두 반찬이 함께 나온 어느 하루 점심시간에 1학년 2반 학생들의 식판만 촬영해 배추김치 80장, 깍두기 20장, 총 100장을 모았다. 하루 점심시간에 서둘러 찍다 보니, 100장 모두 같은 급식실 조명 아래에서 똑같은 은색 식판을 찍은 사진이 되었고 배경과 밝기도 거의 비슷했다. 민수가 사진마다 '배추김치', '깍두기' 이름표를 붙여 모델에 넣자, 모델은 사진 속 색깔, 모양, 크기 같은 특징을 스스로 찾아 두 반찬을 구분하는 규칙을 익혀 나갔다. 민수는 이 100장을 모두 학습에 사용했고, 학습에 썼던 100장을 그대로 다시 사용해 모델을 평가했더니 \"정확도 100%\"라는 결과가 나와 매우 뿌듯해했다."
  ];
  const CASE2_INTRO = "동아리는 AI 급식 도우미에 다음 세 가지 기능을 추가하기로 하고, 동아리원 세 명이 하나씩 맡아 학습용 데이터를 모았다.";
  const CASE2_ITEMS = [
    "㉠ (서연 담당) 날짜별 기온, 메뉴, 급식 인원 데이터를 분석하여 다음 날 잔반량(kg)을 예측한다. 서연은 작년 1년 동안의 급식 기록을 요일, 계절, 메뉴 종류가 골고루 들어가도록 빠짐없이 모아 학습시켰다.",
    "㉡ (도윤 담당) 학생들의 급식 만족도 설문(맛, 양, 다양성) 점수를 분석하여 성향이 비슷한 학생들끼리 그룹을 나눈다. 도윤은 급식을 좋아해서 매번 설문에 자발적으로 참여하는 급식 모니터링단 학생들의 응답만 모아 학습시켰다.",
    "㉢ (지호 담당) 반납된 식판 사진을 분석하여 '잔반 많음'과 '잔반 거의 없음'으로 나눈다. 지호는 사진을 빨리 모으려고, 반찬을 거의 남기지 않는 3학년 운동부 학생들의 식판 사진만 모아 학습시켰다."
  ];
  const PROMPTS = {
    1: "위 사례에 나타난 인공지능의 특성(상황 인식 및 이해, 학습, 최적화, 자율성, 예측) 중 2가지를 찾아, 각각 사례의 어떤 부분에서 그렇게 판단했는지 근거를 들어 설명하시오. 또한 두 특성이 AI 급식 도우미에서 어떻게 서로 연결되어 작동하는지도 서술하시오.",
    2: "위 사례에서 민수의 데이터 수집과 평가 과정에 나타난 ① 평가 방법의 문제, ② 데이터 양의 문제, ③ 데이터 구성(다양성)의 문제를 각각 찾아 설명하고, 그에 대한 개선 방안을 각각 제시하시오.",
    3: "위 사례의 기능 ㉠, ㉡, ㉢에 각각 어떤 인공지능 문제 해결 방법(분류/회귀/군집)이 적합한지 쓰고, 그렇게 판단한 이유를 각각 서술하시오. (단, 예측 결과의 형태가 무엇인지를 근거로 들 것)",
    4: "위 사례의 ㉠, ㉡, ㉢ 중 데이터 편향이 발생할 가능성이 있는 것을 모두 고르시오. 그리고 고른 것 각각에 대해 편향이 생기는 이유와 그로 인해 AI 급식 도우미에서 생길 수 있는 문제를 서술하고, 이를 줄이기 위해 데이터를 어떻게 다시 수집해야 하는지 해결 방안을 제시하시오."
  };

  const MODEL = {

  function check4() {
    const items = [];
    const sel = Q4.map(q => document.getElementById("q4-" + q.k).checked);
    const errors = Q4.filter((q, i) => sel[i] !== q.biased).length;
    const picked = Q4.filter((q, i) => sel[i] && q.biased);
    if (!sel.some(Boolean)) {
      items.push({ ok: false, text: "편향이 생길 수 있는 사례를 먼저 골라 주세요." });
      return { score: 2 + 1, items };
    }
    items.push(errors === 0 ? { ok: true, text: "편향이 생길 수 있는 사례를 정확히 골랐어요." } : { ok: false, text: "고른 사례를 다시 살펴보세요. 데이터를 모은 대상이 한쪽에 치우쳤는지 확인해 보세요. (" + errors + "개 다름)" });
    let reasons = 0, units = 0;
    picked.forEach(q => {
      const w = has(val("q4-" + q.k + "-why"), q.why);
      const h = has(val("q4-" + q.k + "-harm"), q.harm);
      const f = has(val("q4-" + q.k + "-fix"), q.fix);
      if (w) reasons++;
      units += (h ? 1 : 0) + (f ? 1 : 0);
      items.push(w ? { ok: true, text: q.mark + ": 편향이 생기는 이유를 썼어요." } : { ok: false, text: q.mark + ": 데이터를 누구(어떤 조건)에게서만 모았는지 이유를 써 보세요." });
      items.push(h ? { ok: true, text: q.mark + ": 편향 때문에 생길 문제를 썼어요." } : { ok: false, text: q.mark + ": 이 편향 때문에 누가, 어떤 상황에서 잘못 판단되는지 써 보세요." });
      items.push(f ? { ok: true, text: q.mark + ": 데이터 재수집 방안을 썼어요." } : { ok: false, text: q.mark + ": 빠진 대상이나 조건을 어떻게 더 모을지 구체적으로 써 보세요." });
    });
    if (Q4.some((q, i) => sel[i] && !q.biased)) items.push({ ok: false, text: "편향이 없는 사례에 쓴 내용은 채점하지 않아요." });
    const allReasons = picked.length > 0 && reasons === picked.length;
    let e4;
    if (errors === 0 && allReasons) e4 = 6;
    else if (errors === 0 && reasons > 0) e4 = 4;
    else if (errors === 1 && allReasons) e4 = 4;
    else e4 = 2;
    const e5 = units >= 4 ? 5 : units >= 1 ? 3 : 1;
    items.push({ ok: e4 === 6, text: "편향 여부 판단: " + e4 + " / 6점" });
    items.push({ ok: e5 === 5, text: "영향 분석과 해결 방안: " + e5 + " / 5점" });
    return { score: e4 + e5, items };
  }

    let order = shuffle(cfg.parts.map((t, i) => i));
    if (order.every((v, i) => v === i)) order = order.reverse();
    order.forEach(i => {
      pool.appendChild(el("button", { class: "chip", type: "button", id: "c" + (++uid), "data-drag": "order", "data-set": key, "data-i": String(i) }, cfg.parts[i]));
    });
    wrap.appendChild(pool);
    return wrap;
  }
  const slotsOf = set => Array.from(document.querySelectorAll('.slot-box[data-set="' + set + '"]'));
  const poolOf = set => document.querySelector('.pool[data-set="' + set + '"]');
  function clearOrderMarks(set) { slotsOf(set).forEach(s => s.classList.remove("ok", "no")); markNext(set); }
  function markNext(set) {
    const ss = slotsOf(set), first = ss.find(s => !s.firstElementChild);
    ss.forEach(s => s.classList.toggle("next", s === first));
  }
  function putInSlot(slot, chip) {
    const set = chip.dataset.set, old = slot.firstElementChild;
    const from = chip.parentElement;
    if (old && old !== chip) {
      if (from && from.classList.contains("slot-box")) from.appendChild(old);
      else poolOf(set).appendChild(old);
    }
    slot.appendChild(chip);
    clearOrderMarks(set);
  }
  function checkOrder(set) {
    const ss = slotsOf(set); let ok = 0, placed = 0;
    ss.forEach((s, i) => {
      const c = s.firstElementChild;
      if (c) placed++;
      const good = !!c && Number(c.dataset.i) === i;
      s.classList.toggle("ok", good); s.classList.toggle("no", !good);
      if (good) ok++;
    });
    return { ok, total: ss.length, placed };
  }
  function revealOrder(set) {
    const ss = slotsOf(set);
    Array.from(document.querySelectorAll('.chip[data-set="' + set + '"]')).forEach(c => { ss[Number(c.dataset.i)].appendChild(c); });
    ss.forEach(s => { s.classList.add("ok"); s.classList.remove("no", "next"); });
  }
  function resetOrder(set) {
    const p = poolOf(set);
    shuffle(Array.from(document.querySelectorAll('.chip[data-set="' + set + '"]'))).forEach(c => p.appendChild(c));
    clearOrderMarks(set);
  }

  // 탭(누르기)과 끌어다 놓기
  function tapChip(chip) {
    const set = chip.dataset.set;
    if (chip.dataset.drag === "fill") {
      const bs = blanksOf(set);
      const target = bs.find(b => b.classList.contains("sel")) || bs.find(b => !b.dataset.chip);
      if (target) fillBlank(target, chip);
    } else {
      if (chip.parentElement.classList.contains("pool")) {
        const empty = slotsOf(set).find(s => !s.firstElementChild);
        if (empty) putInSlot(empty, chip);
      } else { poolOf(set).appendChild(chip); clearOrderMarks(set); }
    }
  }
  function tapBlank(b) {
    if (b.dataset.chip) { unfill(b); return; }
    const was = b.classList.contains("sel");
    blanksOf(b.dataset.set).forEach(x => x.classList.remove("sel"));
    if (!was) b.classList.add("sel");
  }
  function dropChip(chip, target) {
    if (!target) return;
    const set = chip.dataset.set;
    if (chip.dataset.drag === "fill") {
      const b = target.closest(".blank");
      if (b && b.dataset.set === set) fillBlank(b, chip);
      return;
    }
    const slot = target.closest(".slot-box");
    const pool = target.closest(".pool");
    if (slot && slot.dataset.set === set) putInSlot(slot, chip);
    else if (pool && pool.dataset.set === set) { pool.appendChild(chip); clearOrderMarks(set); }
  }
  let drag = null, suppressClick = false;
  function clearOver() { document.querySelectorAll(".over").forEach(x => x.classList.remove("over")); }
  document.addEventListener("pointerdown", e => {
    const c = e.target.closest("[data-drag]");
    if (!c || e.button > 0) return;
    drag = { el: c, x: e.clientX, y: e.clientY, moved: false, ghost: null };
  });
  document.addEventListener("pointermove", e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
      drag.moved = true;
      const g = drag.el.cloneNode(true);
      g.removeAttribute("id"); g.classList.add("drag-ghost"); g.classList.remove("ok", "no");
      g.style.width = drag.el.offsetWidth + "px";
      document.body.appendChild(g);
      drag.ghost = g;
      drag.el.classList.add("dragging");
    }
    if (drag.moved) {
      e.preventDefault();
      drag.ghost.style.left = e.clientX + "px";
      drag.ghost.style.top = e.clientY + "px";
      clearOver();
      const t = document.elementFromPoint(e.clientX, e.clientY);
      if (t) {
        const set = drag.el.dataset.set;
        const b = t.closest(".blank"), s = t.closest(".slot-box");
        if (drag.el.dataset.drag === "fill" && b && b.dataset.set === set) b.classList.add("over");
        if (drag.el.dataset.drag === "order" && s && s.dataset.set === set) s.classList.add("over");
      }
    }
  }, { passive: false });
  function endDrag(e, cancel) {
    if (!drag) return;
    const d = drag; drag = null;
    clearOver();
    if (d.moved) {
      d.ghost.remove(); d.el.classList.remove("dragging");
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
      if (!cancel) dropChip(d.el, document.elementFromPoint(e.clientX, e.clientY));
    }
  }
  document.addEventListener("pointerup", e => endDrag(e, false));
  document.addEventListener("pointercancel", e => endDrag(e, true));
  window.addEventListener("click", e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);
  document.addEventListener("click", e => {
    const c = e.target.closest("[data-drag]");
    if (c) { tapChip(c); return; }
    const b = e.target.closest(".blank");
    if (b) tapBlank(b);
  });
  document.addEventListener("keydown", e => {
    const b = e.target.closest && e.target.closest(".blank");
    if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tapBlank(b); }
  });

  function mQuestion(n, body, sets) {
    const q = el("article", { class: "q", id: "m-q" + n });
    q.appendChild(qHead(n));
    q.appendChild(el("p", { class: "prompt" }, PROMPTS[n]));
    q.appendChild(body);
    if (!sets) return q;
    const act = el("div", { class: "actions" });
    const btn = el("button", { class: "btn", type: "button" }, "답안 확인하기");
    const show = el("button", { class: "btn ghost", type: "button" }, "정답 보기");
    const reset = el("button", { class: "btn ghost", type: "button" }, "다시 하기");
    act.appendChild(btn); act.appendChild(show); act.appendChild(reset);
    q.appendChild(act);
    const msg = el("p", { class: "msg", "aria-live": "polite" });
    q.appendChild(msg);
    btn.addEventListener("click", () => {
      let ok = 0, total = 0, missing = false;
      sets.forEach(s => {
        if (FILLS[s]) { const r = checkFill(s); ok += r.ok; total += r.total; }
        else { const r = checkOrder(s); ok += r.ok; total += r.total; if (r.placed < r.total) missing = true; }
      });
      if (total === 0) { msg.className = "msg part"; msg.textContent = "먼저 1단계를 마쳐 주세요."; return; }
      msg.className = "msg " + (ok === total ? "ok" : ok >= total / 2 ? "part" : "no");
      msg.textContent = ok === total ? "모두 맞았어요! 완성한 문장을 소리 내어 한 번 읽어 보세요." :
        (missing ? "아직 옮기지 않은 조각이 있어요. " : "") + total + "개 중 " + ok + "개 맞았어요. 빨간 칸을 다시 생각해 보세요.";
    });
    show.addEventListener("click", () => { sets.forEach(s => FILLS[s] ? revealFill(s) : revealOrder(s)); msg.className = "msg"; msg.textContent = "정답을 보여 주고 있어요. '다시 하기'로 처음부터 풀 수 있어요."; });
    reset.addEventListener("click", () => { sets.forEach(s => FILLS[s] ? resetFill(s) : resetOrder(s)); msg.textContent = ""; });
    return q;
  }

  function buildM() {
    const root = panels.m;
    root.appendChild(el("p", { class: "hint" }, "예시 답안의 빈칸과 순서를 맞히면서 답안을 어떻게 쓰는지 익혀 보세요."));
    const g1 = el("div", { class: "group" });
    g1.appendChild(caseCard(1, true));
    const qs1 = el("div", { class: "qs" });
    const b1 = el("div", { class: "qs" });
    b1.appendChild(el("p", { class: "sub-title" }, "1단계 · 사례에서 찾은 특성 2가지를 누르세요"));
    b1.appendChild(el("p", { class: "hint" }, "어떤 두 특성을 골라도 사례에 근거가 있으면 정답이에요. 고른 특성에 맞는 문장이 나와요."));
    const tRow = el("div", { class: "picks" });
    const tBtns = TRAIT_NAMES.map(name => {
      const t = el("button", { class: "pick", type: "button", "aria-pressed": "false" }, name);
      t.addEventListener("click", () => {
        const on = t.getAttribute("aria-pressed") === "true";
        if (!on && tBtns.filter(x => x.getAttribute("aria-pressed") === "true").length >= 2) { t1Msg.className = "msg part"; t1Msg.textContent = "특성은 2가지만 고를 수 있어요. 다른 것을 먼저 빼 주세요."; return; }
        t.setAttribute("aria-pressed", on ? "false" : "true");
        t.classList.toggle("on", !on);
        t1Msg.textContent = "";
      });
      tRow.appendChild(t); return t;
    });
    b1.appendChild(tRow);
    const t1Act = el("div", { class: "actions" });
    const t1Btn = el("button", { class: "btn", type: "button" }, "이 두 특성으로 문장 만들기");
    t1Act.appendChild(t1Btn); b1.appendChild(t1Act);
    const t1Msg = el("p", { class: "msg", "aria-live": "polite" });
    b1.appendChild(t1Msg);
    const m1Area = el("div", { class: "qs" });
    b1.appendChild(m1Area);
    t1Btn.addEventListener("click", () => {
      const idx = tBtns.map((t, i) => t.getAttribute("aria-pressed") === "true" ? i : -1).filter(i => i >= 0);
      if (idx.length !== 2) { t1Msg.className = "msg part"; t1Msg.textContent = "특성을 2가지 골라 주세요."; return; }
      t1Msg.className = "msg"; t1Msg.textContent = "";
      FILLS.m1 = { text: "첫째, " + TRAIT_FILL[idx[0]] + " 둘째, " + TRAIT_FILL[idx[1]] + " 두 특성은 서로 연결되어 작동한다. " + PAIR_REL[idx[0] + "-" + idx[1]], extra: M1_EXTRA };
      m1Area.innerHTML = "";
      m1Area.appendChild(el("p", { class: "sub-title" }, "2단계 · 빈칸을 채워 답안을 완성하세요"));
      m1Area.appendChild(buildFill("m1"));
    });
    qs1.appendChild(mQuestion(1, b1, ["m1"]));
    const o = el("div", { class: "qs" });
    ["m2a", "m2b", "m2c"].forEach(k => o.appendChild(buildOrder(k)));
    qs1.appendChild(mQuestion(2, o, ["m2a", "m2b", "m2c"]));
    g1.appendChild(qs1);
    root.appendChild(g1);

    const g2 = el("div", { class: "group" });
    g2.appendChild(caseCard(2, true));
    const qs2 = el("div", { class: "qs" });
    qs2.appendChild(mQuestion(3, buildFill("m3"), ["m3"]));

    // 문항 4: 1단계 선택 → 2단계 빈칸
    const b4 = el("div", { class: "qs" });
    b4.appendChild(el("p", { class: "sub-title" }, "1단계 · 편향이 생길 수 있는 사례를 모두 누르세요"));
    const row = el("div", { class: "picks" });
    const toggles = ["㉠", "㉡", "㉢"].map((m, i) => {
      const t = el("button", { class: "toggle", type: "button", "aria-pressed": "false", "data-correct": i === 0 ? "0" : "1" }, m);
      t.addEventListener("click", () => { t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") === "true" ? "false" : "true"); row.querySelectorAll(".toggle").forEach(x => x.classList.remove("ok", "no")); });
      row.appendChild(t); return t;
    });
    b4.appendChild(row);
    const selAct = el("div", { class: "actions" });
    const selBtn = el("button", { class: "btn", type: "button" }, "선택 확인하기");
    selAct.appendChild(selBtn);
    b4.appendChild(selAct);
    const selMsg = el("p", { class: "msg", "aria-live": "polite" });
    b4.appendChild(selMsg);
    const step2 = el("div", { class: "qs step2" }); step2.hidden = true;
    step2.appendChild(el("p", { class: "sub-title" }, "2단계 · 편향이 생기는 이유, 문제, 해결 방안을 완성하세요"));
    step2.appendChild(buildFill("m4b"));
    step2.appendChild(buildFill("m4c"));
    b4.appendChild(step2);
    selBtn.addEventListener("click", () => {
      let good = 0;
      toggles.forEach(t => { const on = t.getAttribute("aria-pressed") === "true"; const right = on === (t.dataset.correct === "1"); t.classList.toggle("ok", right); t.classList.toggle("no", !right); if (right) good++; });
      if (good === 3) { selMsg.className = "msg ok"; selMsg.textContent = "정확해요! ㉡과 ㉢은 데이터를 한쪽 학생들에게서만 모았어요."; }
      else { selMsg.className = "msg no"; selMsg.textContent = "정답은 ㉡, ㉢이에요. ㉠은 1년 동안의 기록을 골고루 모아서 편향이 적어요."; }
      step2.hidden = false;
    });
    qs2.appendChild(mQuestion(4, b4, ["m4b", "m4c"]));
    g2.appendChild(qs2);
    root.appendChild(g2);
  }

  buildPC();
  buildM();
  document.querySelectorAll(".answer-zone").forEach(z => markNext(z.dataset.set));
  const saved = store.get("ai-lunch-tab", null);
  showTab(saved || (window.matchMedia && window.matchMedia("(max-width: 700px)").matches ? "m" : "pc"));
})();
</script>
